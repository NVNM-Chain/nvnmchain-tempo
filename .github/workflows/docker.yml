name: Docker Build

permissions: {}

# Only refs that are actually deployed from. Upstream also builds on a nightly
# cron and on merge_group; both are out of reach here, because a build on
# GitHub-hosted runners keeps no layer cache and recompiles the whole reth
# dependency tree from scratch on each architecture.
on:
  push:
    branches:
      - main
      - "rc/*"
    tags:
      - "v*.*.*"
  workflow_dispatch:
  workflow_call:

# A tag build is the one a release depends on, so it is never cancelled; a
# superseded branch build is, or hours-long builds stack up behind each other.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    # Multi-arch is built natively on one runner per architecture and the
    # per-arch digests are stitched into a manifest list by the `merge` job.
    # Emulating arm64 with QEMU is not viable here: the Dockerfile.chef stage
    # compiles the whole reth dependency tree.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: tempoxyz/gh-actions/vendor/docker/setup-buildx-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e

      - name: Log in to Container Registry
        uses: tempoxyz/gh-actions/vendor/docker/login-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          # `login-action` only needs the registry host; the lowercase
          # namespace is applied where the image names are constructed.
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: shortsha
        run: echo "shortsha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERGEN_GIT_SHA: ${{ github.sha }}
          VERGEN_GIT_SHA_SHORT: ${{ steps.shortsha.outputs.shortsha }}
        run: |
          set -euo pipefail

          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          registry="ghcr.io/${owner}"
          targets=(tempo tempo-localnet tempo-sidecar tempo-xtask)

          args=()
          # The `chef` base image is pulled in as a named build context, so it
          # must be pinned to the same platform as the final images.
          args+=(--set "chef.platform=${PLATFORM}")
          # GHCR links a package to its repository through this label, and a
          # linked package is the only one that can inherit the repository's
          # visibility. Without it every package stays private and each
          # deployment target needs a token of its own.
          args+=(--set "*.labels.org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}")
          for target in "${targets[@]}"; do
            args+=(--set "${target}.platform=${PLATFORM}")
            # `name` is required: with `push-by-digest` there are no tags to
            # derive the destination repository from.
            args+=(--set "${target}.output=type=image,name=${registry}/${target},push-by-digest=true,name-canonical=true,push=true")
          done

          docker buildx bake \
            --file docker-bake.hcl \
            --metadata-file meta.json \
            --pull \
            "${args[@]}" \
            "${targets[@]}"

      - name: Collect digests
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          out="digests-${ARCH}.txt"
          : > "$out"
          for target in tempo tempo-localnet tempo-sidecar tempo-xtask; do
            digest="$(jq -er --arg t "$target" '.[$t]["containerimage.digest"]' meta.json)"
            echo "${target} ${digest}" >> "$out"
          done

          cat "$out"

      - name: Upload digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-digests-${{ matrix.arch }}
          path: digests-${{ matrix.arch }}.txt
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Merge and sign manifest lists
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # GHCR rejects uppercase repository paths, and github.repository_owner
      # preserves the owner's casing. `docker/metadata-action` lowercases the
      # image names it is given, but the shell-facing references below need the
      # lowercase form explicitly.
      - name: Resolve registry
        shell: bash
        run: |
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "REGISTRY=ghcr.io/${owner}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-digests-*
          path: digests
          merge-multiple: true

      - name: Docker metadata for tempo
        id: meta-tempo
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          images: ghcr.io/${{ github.repository_owner }}/tempo
          bake-target: tempo
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-localnet
        id: meta-tempo-localnet
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          images: ghcr.io/${{ github.repository_owner }}/tempo-localnet
          bake-target: tempo-localnet
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-sidecar
        id: meta-tempo-sidecar
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          images: ghcr.io/${{ github.repository_owner }}/tempo-sidecar
          bake-target: tempo-sidecar
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-xtask
        id: meta-tempo-xtask
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          images: ghcr.io/${{ github.repository_owner }}/tempo-xtask
          bake-target: tempo-xtask
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Set up Docker Buildx
        uses: tempoxyz/gh-actions/vendor/docker/setup-buildx-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e

      - name: Log in to Container Registry
        uses: tempoxyz/gh-actions/vendor/docker/login-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: shortsha
        run: echo "shortsha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Create manifest lists
        shell: bash
        env:
          TAGS_TEMPO: ${{ steps.meta-tempo.outputs.tags }}
          TAGS_TEMPO_LOCALNET: ${{ steps.meta-tempo-localnet.outputs.tags }}
          TAGS_TEMPO_SIDECAR: ${{ steps.meta-tempo-sidecar.outputs.tags }}
          TAGS_TEMPO_XTASK: ${{ steps.meta-tempo-xtask.outputs.tags }}
        run: |
          set -euo pipefail

          declare -A tags_by_image=(
            [tempo]="$TAGS_TEMPO"
            [tempo-localnet]="$TAGS_TEMPO_LOCALNET"
            [tempo-sidecar]="$TAGS_TEMPO_SIDECAR"
            [tempo-xtask]="$TAGS_TEMPO_XTASK"
          )

          for image in tempo tempo-localnet tempo-sidecar tempo-xtask; do
            repo="${REGISTRY}/${image}"
            sources=()
            while read -r name digest; do
              [ "$name" = "$image" ] || continue
              sources+=("${repo}@${digest}")
            done < <(cat digests/digests-*.txt)

            if [ "${#sources[@]}" -eq 0 ]; then
              echo "::error::No digests collected for ${image}"
              exit 1
            fi

            args=()
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              args+=("--tag" "$tag")
            done <<< "${tags_by_image[$image]}"

            echo "Creating ${image} manifest list from: ${sources[*]}"
            if [ "${#args[@]}" -gt 0 ]; then
              docker buildx imagetools create "${args[@]}" "${sources[@]}"
            else
              # Nothing to point at the per-arch digests, so they stay in the
              # registry untagged. Every trigger left derives tags, so this is
              # a guard rather than an expected path.
              echo "No tags derived for ${image}; skipping manifest creation"
            fi
          done

      - name: Install cosign
        uses: tempoxyz/gh-actions/vendor/sigstore/cosign-installer@3626124474a987bc74b41fc7ae65b2e23f8e4e4e

      - name: Sign Docker images
        id: sign-images
        shell: bash
        env:
          TEMPO_TAGS: ${{ steps.meta-tempo.outputs.tags }}
          TEMPO_LOCALNET_TAGS: ${{ steps.meta-tempo-localnet.outputs.tags }}
          TEMPO_SIDECAR_TAGS: ${{ steps.meta-tempo-sidecar.outputs.tags }}
          TEMPO_XTASK_TAGS: ${{ steps.meta-tempo-xtask.outputs.tags }}
        run: |
          set -euo pipefail
          sign_image() {
            local image="$1"
            local attempt

            for attempt in 1 2 3; do
              if cosign sign --yes --recursive "$image"; then
                return 0
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Failed to sign $image after $attempt attempts" >&2
                return 1
              fi

              sleep_seconds=$((attempt * 15))
              echo "cosign sign failed for $image; retrying in ${sleep_seconds}s (attempt $((attempt + 1))/3)" >&2
              sleep "$sleep_seconds"
            done
          }

          images=(
            "$TEMPO_TAGS"
            "$TEMPO_LOCALNET_TAGS"
            "$TEMPO_SIDECAR_TAGS"
            "$TEMPO_XTASK_TAGS"
          )
          sign_failures=0
          signed=0
          for tags in "${images[@]}"; do
            while IFS= read -r image; do
              [ -n "$image" ] || continue
              signed=$((signed + 1))
              if ! sign_image "$image"; then
                sign_failures=$((sign_failures + 1))
              fi
            done <<< "$tags"
          done

          if [ "$sign_failures" -ne 0 ]; then
            echo "Failed to sign $sign_failures image reference(s)" >&2
            exit 1
          fi
          echo "Signed ${signed} image reference(s)"

      - name: Summarize Docker build
        if: ${{ always() }}
        shell: bash
        env:
          TEMPO_TAGS: ${{ steps.meta-tempo.outputs.tags }}
          TEMPO_LOCALNET_TAGS: ${{ steps.meta-tempo-localnet.outputs.tags }}
          TEMPO_SIDECAR_TAGS: ${{ steps.meta-tempo-sidecar.outputs.tags }}
          TEMPO_XTASK_TAGS: ${{ steps.meta-tempo-xtask.outputs.tags }}
          SHORT_SHA: ${{ steps.shortsha.outputs.shortsha }}
          BUILD_OUTCOME: ${{ needs.build.result }}
          SIGN_OUTCOME: ${{ steps.sign-images.outcome }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SERVER: ${{ github.server_url }}
          GH_SHA: ${{ github.sha }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          job_url="${GH_SERVER}/${GH_REPO}/actions/runs/${GH_RUN_ID}"
          if command -v gh >/dev/null 2>&1; then
            resolved_job_url="$(gh api \
              "repos/${GH_REPO}/actions/runs/${GH_RUN_ID}/jobs" \
              --paginate \
              --jq '.jobs[] | select(.name == "Merge and sign manifest lists") | .html_url' \
              | head -n 1 || true)"
            if [ -n "$resolved_job_url" ]; then
              job_url="$resolved_job_url"
            fi
          fi

          {
            echo "## Docker build"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | [\`${GH_SHA}\`](${GH_SERVER}/${GH_REPO}/commit/${GH_SHA}) |"
            echo "| Ref | \`${GH_REF_NAME}\` |"
            echo "| Workflow run | [run #${GH_RUN_NUMBER}](${GH_SERVER}/${GH_REPO}/actions/runs/${GH_RUN_ID}) |"
            echo "| Job summary | [Merge and sign manifest lists](${job_url}) |"
            echo "| Short SHA tag | \`sha-${SHORT_SHA}\` |"
            echo "| Build | \`${BUILD_OUTCOME:-unknown}\` |"
            echo "| Sign | \`${SIGN_OUTCOME:-unknown}\` |"
            echo
            echo "## Images"
            echo
            echo "| Image | Tags |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          summarize_image() {
            local image="$1"
            local tags="$2"
            local formatted=""
            local tag

            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              if [ -n "$formatted" ]; then
                formatted="${formatted}<br>${tag}"
              else
                formatted="$tag"
              fi
            done <<< "$tags"

            echo "| ${image} | ${formatted:-None} |" >> "$GITHUB_STEP_SUMMARY"
          }

          summarize_image "\`${REGISTRY}/tempo\`" "$TEMPO_TAGS"
          summarize_image "\`${REGISTRY}/tempo-localnet\`" "$TEMPO_LOCALNET_TAGS"
          summarize_image "\`${REGISTRY}/tempo-sidecar\`" "$TEMPO_SIDECAR_TAGS"
          summarize_image "\`${REGISTRY}/tempo-xtask\`" "$TEMPO_XTASK_TAGS"
